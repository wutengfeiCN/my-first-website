name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build dependencies
        run: pip install -r requirements.txt

      - name: Cache font source
        uses: actions/cache@v4
        with:
          path: .fonts
          key: lxgw-wenkai-regular-1

      - name: Build notes from Markdown
        run: python scripts/build.py

      - name: Assemble site
        run: |
          mkdir -p _site
          cp index.html 404.html about.html robots.txt sitemap.xml rss.xml _site/
          cp -r assets notes _site/

      - name: Configure Pages
        # 注意：Pages 站点必须先在仓库 Settings → Pages 里手动启用一次。
        # 默认的 GITHUB_TOKEN 无权创建 Pages 站点，因此不要在这里使用 enablement: true。
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
