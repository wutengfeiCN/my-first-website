<head>

<script>
  (function () {
    var saved = null;
    try { saved = localStorage.getItem('theme'); } catch (e) {}
    var night = saved ? saved === 'night'
                      : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
    if (night) document.documentElement.classList.add('night');
  })();
</script>
<style>
  @font-face {
    font-family: "LXGW WenKai";
    src: url("https://wutengfeiCN.github.io/my-first-website/assets/fonts/wenkai-subset.woff2") format("woff2");
    font-weight: 400;
    font-style: normal;
    font-display: swap;
  }
  :root {
    color-scheme: light;
    --paper: #f7f4ee;
    --card: #fffdf9;
    --ink: #2b2b2b;
    --ink-soft: #6b6459;
    --cinnabar: #c03f2b;
    --accent-text: #c03f2b;
    --hairline: #e6e0d4;
    --serif: "LXGW WenKai", "Songti SC", "Noto Serif CJK SC", "Source Han Serif SC", "Noto Serif SC", "SimSun", serif;
    --sans: -apple-system, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
  }
  html.night {
    color-scheme: dark;
    --paper: #1a1815;
    --card: #24211b;
    --ink: #e8e2d5;
    --ink-soft: #9d9484;
    --cinnabar: #d4553f;
    --accent-text: #e2705a;
    --hairline: #4a4438;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 48px 24px;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--serif);
    line-height: 1.8;
  }
  .card {
    max-width: 34em;
    width: 100%;
    padding: 40px 36px;
    background: var(--card);
    border: 1px solid var(--hairline);
    border-radius: 10px;
    box-shadow: 0 2px 10px rgba(43, 43, 43, .05);
  }
  .code {
    font-family: var(--sans);
    font-size: 12px;
    letter-spacing: .34em;
    color: var(--ink-soft);
  }
  h1 {
    margin-top: 12px;
    font-size: clamp(28px, 6vw, 40px);
    font-weight: 400;
    line-height: 1.3;
  }
  p {
    margin-top: 14px;
    color: var(--ink-soft);
    font-size: 16px;
  }
  a.home {
    display: inline-block;
    margin-top: 28px;
    padding-bottom: 3px;
    color: var(--ink);
    text-decoration: none;
    border-bottom: 1px solid var(--cinnabar);
  }
  a.home:hover { color: var(--accent-text); }
  .mail {
    margin-top: 18px;
    font-family: var(--sans);
    font-size: 13px;
  }
  .mail a { color: var(--ink-soft); text-decoration: none; }
  .mail a:hover { color: var(--accent-text); }
  :focus-visible { outline: 2px solid var(--cinnabar); outline-offset: 3px; }
  @media print { body { background: #fff; } .card { box-shadow: none; } }
</style>
</head>
<body>
  <main class="card">
    <p class="code">404</p>
    <h1>这一页不在书里。</h1>
    <p>链接可能旧了，或者这一页我还没写。</p>
    <a class="home" href="https://wutengfeiCN.github.io/my-first-website/">回到首页 →</a>
    <p class="mail">或者来信：<a href="mailto:wutf@163.com">wutf@163.com</a></p>
  </main>
</body>
</html>
